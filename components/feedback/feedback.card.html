<body><div id="root"></div><script type="text/babel">
const { Callout, Dialog, Tooltip, Button } = window.EgidiaDesignSystem_36aa4a;
function Demo(){
  const [open,setOpen]=React.useState(false);
  return (
    <div className="stack">
      <Callout tone="attention" title="Les délais de recours sont très courts">Un délai manqué se rattrape difficilement. Consultez-nous dès la réception d'une décision.</Callout>
      <Callout tone="urgent" title="Ce n'est PAS la proposition de déclaration simplifiée">L'Avertissement-Extrait de Rôle est le document définitif.</Callout>
      <div className="grp">
        <Tooltip content="Mineurs étrangers non accompagnés"><span style={{borderBottom:'1px dotted var(--brun-moyen)',fontSize:18}}>MENA</span></Tooltip>
        <Button size="md" variant="secondary" onClick={()=>setOpen(true)}>Ouvrir le dialogue</Button>
      </div>
      <Dialog open={open} title="Prendre contact" description="Les consultations ont lieu uniquement sur rendez-vous, par téléphone ou par e-mail." onClose={()=>setOpen(false)}
        footer={<><Button variant="secondary" size="md" onClick={()=>setOpen(false)}>Fermer</Button><Button size="md" as="a" href="mailto:info@egidia-avocates.be">Écrire au cabinet</Button></>} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);</script></body></html>
