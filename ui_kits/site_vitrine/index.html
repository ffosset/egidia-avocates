<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Egidia — site vitrine</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Data.jsx"></script>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Accueil.jsx"></script>
<script type="text/babel" src="Matiere.jsx"></script>
<script type="text/babel" src="FicheAvocate.jsx"></script>
<script type="text/babel" src="ProDeo.jsx"></script>
<script type="text/babel">
const { SiteHeader, PageRules } = window.EgidiaDesignSystem_36aa4a;
const LINKS = [
  { id: 'accueil#matieres', label: 'Services' },
  { id: 'accueil#honoraires', label: 'Honoraires' },
  { id: 'accueil#equipe', label: 'Équipe' },
  { id: 'accueil#contact', label: 'Contact' },
];
function App() {
  const [route, setRoute] = React.useState('accueil');
  const go = (r) => {
    const [page, anchor] = r.split('#');
    setRoute(page || 'accueil');
    requestAnimationFrame(() => {
      const el = anchor && document.getElementById(anchor);
      if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 24);
      else window.scrollTo(0, 0);
    });
  };
  let screen;
  if (route.startsWith('matiere:')) screen = <window.Matiere id={route.slice(8)} onNavigate={go} />;
  else if (route.startsWith('avocate:')) screen = <window.FicheAvocate nom={route.slice(8)} onNavigate={go} />;
  else if (route === 'prodeo') screen = <window.ProDeo onNavigate={go} />;
  else screen = <window.Accueil onNavigate={go} />;
  return (<>
    <PageRules />
    <SiteHeader links={LINKS} onNavigate={go} />
    {screen}
    <SiteFooter onNavigate={go} />
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
