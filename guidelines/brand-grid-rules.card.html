<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--creme-pur);margin:0;padding:0;font-size:16px}.frame{position:relative;height:230px;overflow:hidden}.rule{position:absolute;top:0;bottom:0;width:1px;background:var(--line-page-rule)}.band{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--sauge-obscur)}.cap{font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-label)}</style></head><body>
<div class="frame">
<div class="band"></div>
<div style="position:absolute;left:48px;right:48px;top:0;bottom:0;display:grid;grid-template-columns:1fr 260px;gap:28px;align-items:start;padding:24px 28px">
<div>
<div class="cap">Filets de marge · 48px des bords</div>
<div style="font-family:var(--font-display);font-size:26px;font-weight:700;margin-top:10px;max-width:16ch;line-height:1.2">Les filets traversent le clair et le foncé</div>
<div style="margin-top:10px;font-size:15px;color:var(--brun-moyen);max-width:38ch">Aucune bande pleine largeur ne les interrompt. La structure de la page reste lisible de haut en bas.</div>
</div>
<div style="height:150px;background:var(--sable);border-bottom-left-radius:42% 52%;display:grid;place-items:end start;padding:14px"><span style="font-size:14px;color:var(--brun-moyen)">arc du bouclier</span></div>
</div>
<div class="rule" style="left:48px"></div>
<div class="rule" style="right:48px"></div>
</div>
</body></html>
